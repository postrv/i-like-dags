name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job writes repository or check state.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action pinned; toolchain below
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo fmt --all --check
      - run: git diff --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action pinned; toolchain below
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo test --locked --workspace --all-features --no-fail-fast
        timeout-minutes: 20

  msrv:
    name: Rust 1.89 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: msrv-1.89
      - run: cargo check --locked --workspace --all-features

  console:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/dag-api/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: crates/dag-api/web/package-lock.json
      # Lockfile-only install with dependency lifecycle scripts disabled. The
      # project has no required install hooks; explicit build/test commands run
      # below under reviewable CI steps.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node ../../../scripts/check-npm-lock-policy.mjs package-lock.json
      - run: npm run check
      - run: npm audit --audit-level=moderate
      # The compiled modules are committed so `cargo build` never needs Node.
      # Recompile and fail if the checked-in output has drifted from the source.
      - run: npm run build
      - name: Verify dist/ is up to date
        run: |
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all -- dist)" ]]; then
            echo "::error::web/dist is stale or contains untracked generated output — run 'npm run build' in crates/dag-api/web and commit the complete result"
            git status --short --untracked-files=all -- dist
            exit 1
          fi

  edge:
    name: Cloudflare Edge runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/dag-edge/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: crates/dag-edge/worker/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node ../../../scripts/check-npm-lock-policy.mjs package-lock.json
      - run: npm run typecheck
      - run: npm run types:check
      - run: npm test
      - run: npm run check:deploy
      - run: npx --no-install wrangler deploy --dry-run -c ../wrangler.jsonc
      - run: npx --no-install wrangler deploy --dry-run -c wrangler.test.jsonc
      - run: npm audit --audit-level=moderate

  wasm-browser:
    name: Browser verifier kernel
    runs-on: ubuntu-latest
    env:
      # Workflow-level RUSTFLAGS overrides .cargo/config.toml rustflags.
      # getrandom 0.3 still needs the wasm_js backend cfg on this target.
      RUSTFLAGS: -D warnings --cfg getrandom_backend="wasm_js"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      # The generated WASM is committed and compared byte-for-byte below, so
      # its compiler is part of the artifact toolchain rather than a floating
      # CI preference. Update this pin deliberately and rebuild the assets.
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: wasm-bindgen-cli@0.2.104
      - run: cargo check --locked -p dag-wasm --target wasm32-unknown-unknown --all-features
      - run: node crates/dag-wasm/web/build-browser.mjs
      - name: Verify committed browser kernel is reproducible
        run: |
          required=(
            crates/dag-edge/worker/public/dag_wasm.js
            crates/dag-edge/worker/public/dag_wasm_bg.wasm
            crates/dag-wasm/web/browser-kernel.mjs
            crates/dag-wasm/web/browser-kernel.d.mts
            crates/dag-wasm/web/dist/dag_wasm.js
            crates/dag-wasm/web/dist/dag_wasm_bg.wasm
          )
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::generated browser kernel is missing $file"
              exit 1
            fi
          done
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all -- "${required[@]}")" ]]; then
            echo "::error::generated browser kernel is stale or not tracked"
            git status --short --untracked-files=all -- "${required[@]}"
            exit 1
          fi

  demo:
    name: End-to-end demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action pinned; toolchain below
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: ./scripts/demo.sh
        timeout-minutes: 15

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Keep this as a pristine full-history checkout. Gitleaks 8.18.4 path
      # allowlists suppress findings but do not prevent no-git file I/O, so no
      # dependency/build install or repository-controlled command may precede
      # the scan; only the checksum-verified scanner setup runs first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Gitleaks 8.30.1 has an upstream default-rule regression (issue #2170).
      # Pin a known-working detector and prove the vendored no-global-allowlist
      # history rules are the one documented transform of the official rules.
      - name: Install Gitleaks 8.18.4 and verify rules provenance
        env:
          GITLEAKS_VERSION: 8.18.4
          GITLEAKS_LINUX_X64_SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          GITLEAKS_DEFAULT_CONFIG_SHA256: b94aad1d0f105e4d7cb230872461705a4b04a7743c656836144ae6853cb33e1b
          GITLEAKS_HISTORY_CONFIG_SHA256: ee6d0db9b45356c4c9c8a9361232d90752a5516539452987f7a87809b17281f5
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          binary_dir="${RUNNER_TEMP}/dag-security-bin"
          default_config="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}-default.toml"
          stripped_config="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}-no-global-allowlist.toml"
          mkdir -p "${binary_dir}"
          curl --fail --silent --show-error --location --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${binary_dir}" gitleaks
          chmod 0755 "${binary_dir}/gitleaks"
          printf '%s\n' "${binary_dir}" >> "${GITHUB_PATH}"
          curl --fail --silent --show-error --location --output "${default_config}" \
            "https://raw.githubusercontent.com/gitleaks/gitleaks/v${GITLEAKS_VERSION}/config/gitleaks.toml"
          printf '%s  %s\n' "${GITLEAKS_DEFAULT_CONFIG_SHA256}" "${default_config}" | sha256sum --check -
          awk '
            BEGIN { skip = 0 }
            /^\[allowlist\]$/ { skip = 1; next }
            skip && /^\[\[rules\]\]$/ { skip = 0 }
            !skip { print }
          ' "${default_config}" > "${stripped_config}"
          printf '%s  %s\n' "${GITLEAKS_HISTORY_CONFIG_SHA256}" "${stripped_config}" | sha256sum --check -
          printf '%s  %s\n' "${GITLEAKS_HISTORY_CONFIG_SHA256}" \
            "${GITHUB_WORKSPACE}/.gitleaks-history.toml" | sha256sum --check -
          if ! cmp --silent "${stripped_config}" "${GITHUB_WORKSPACE}/.gitleaks-history.toml"; then
            echo "::error::vendored Gitleaks history rules do not match the verified transform"
            exit 1
          fi
      # Prove both configurations find an ordinary token, source scanning alone
      # suppresses a non-release dependency-path token, and history does not
      # inherit that or the official default path allowlist. The probes live in
      # RUNNER_TEMP, never in source.
      - name: Scan pristine source and candidate history
        run: |
          set -euo pipefail
          probe="${RUNNER_TEMP}/gitleaks-self-test.txt"
          allowed_probe_dir="${RUNNER_TEMP}/node_modules"
          allowed_probe="${allowed_probe_dir}/gitleaks-self-test.txt"
          tracked_allowlisted="$(git ls-files -- \
            ':(glob)**/.git/**' \
            ':(glob)**/target/**' \
            ':(glob)**/node_modules/**' \
            ':(glob)**/.wrangler/**' \
            ':(glob)**/.dag/**' \
            ':(glob)**/fuzz/target/**' \
            ':(glob)**/fuzz/corpus/**' \
            ':(glob)**/fuzz/artifacts/**' \
            ':(glob)**/.agents/**' \
            ':(glob)**/.archive/**' \
            ':(glob)**/.claude/**' \
            ':(glob)**/.cowork/**' \
            ':(glob)**/.idea/**' \
            ':(glob)**/.ralph/**' \
            ':(glob)**/.vscode/**')"
          if [[ -n "${tracked_allowlisted}" ]]; then
            echo "::error::tracked source is hidden by the source-scan allowlist"
            printf '%s\n' "${tracked_allowlisted}"
            exit 1
          fi
          mkdir -p "${allowed_probe_dir}"
          printf 'token = "ghp_%s%s"\n' \
            'aBcDeFgHiJkLmNoPqRsTuVwXyZ' '0123456789' > "${probe}"
          cp "${probe}" "${allowed_probe}"
          set +e
          gitleaks detect --no-git --source "${probe}" \
            --config "${GITHUB_WORKSPACE}/.gitleaks.toml" --redact --no-banner
          source_probe_status="$?"
          gitleaks detect --no-git --source "${probe}" \
            --config "${GITHUB_WORKSPACE}/.gitleaks-history.toml" --redact --no-banner
          history_probe_status="$?"
          gitleaks detect --no-git --source "${allowed_probe}" \
            --config "${GITHUB_WORKSPACE}/.gitleaks.toml" --redact --no-banner
          allowlist_status="$?"
          gitleaks detect --no-git --source "${allowed_probe}" \
            --config "${GITHUB_WORKSPACE}/.gitleaks-history.toml" --redact --no-banner
          history_allowlist_status="$?"
          set -e
          if [[ "${source_probe_status}" -ne 1 ]]; then
            echo "::error::gitleaks source detector self-test returned ${source_probe_status}, expected 1"
            exit 1
          fi
          if [[ "${history_probe_status}" -ne 1 ]]; then
            echo "::error::gitleaks history detector self-test returned ${history_probe_status}, expected 1"
            exit 1
          fi
          if [[ "${allowlist_status}" -ne 0 ]]; then
            echo "::error::gitleaks allowlist self-test returned ${allowlist_status}, expected 0"
            exit 1
          fi
          if [[ "${history_allowlist_status}" -ne 1 ]]; then
            echo "::error::gitleaks history path self-test returned ${history_allowlist_status}, expected 1"
            exit 1
          fi
          gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner
          gitleaks detect --source . --config .gitleaks-history.toml --redact --no-banner

  audit:
    name: Dependency policy and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action pinned; toolchain below
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          # deny.toml makes licenses, sources, bans and advisory exceptions
          # reviewable. Pin the downloaded policy engine too.
          tool: cargo-deny@0.19.0
      - run: cargo deny --locked check --hide-inclusion-graph
      # Install a prebuilt binary. Building cargo-audit from source cost
      # ~6 minutes per run, which dwarfed every other job in this workflow.
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          # Pin the downloaded executable as well as the installer action;
          # otherwise the same reviewed workflow silently runs a new binary.
          tool: cargo-audit@0.22.0
      # Defense-in-depth advisory scan. cargo-deny is the authoritative policy
      # gate and carries the two exact, reasoned sled-only exceptions; this
      # second scanner still fails on every vulnerability and reports the two
      # unmaintained migration-only transitives as informational warnings.
      - run: cargo audit
  dependency-review:
    name: Dependency diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
