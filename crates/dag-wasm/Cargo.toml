[package]
name = "dag-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "wasm32 bindings over dag-core: CID compute, deep verify, DSSE envelope check."
categories = ["wasm", "cryptography"]
keywords = ["content-addressed", "wasm", "cid", "verify"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dag-core = { workspace = true, features = ["wasm"] }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# The browser artifacts under `dag-edge/worker/public` are generated by the
# matching CLI. wasm-bindgen's binary format is version-coupled, so keep this
# exact and update it together with `web/build-browser.mjs`.
wasm-bindgen = "=0.2.104"
