<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dag console</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%230a8b86'/><path d='M4 8h8M8 4v8' stroke='white' stroke-width='1.6'/></svg>">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">dag</span>
      <span class="brand-sub">console</span>
    </div>

    <div class="topbar-status">
      <span class="conn" id="conn" data-state="connecting" title="Live event stream">
        <span class="conn-dot"></span><span id="conn-label">connecting</span>
      </span>
      <button class="btn btn-ghost" id="theme-toggle" type="button" aria-label="Switch colour theme">
        <span id="theme-icon" aria-hidden="true">◐</span>
      </button>
    </div>
  </header>

  <nav class="rail" aria-label="Sections">
    <a href="#/overview" data-view="overview">Overview</a>
    <a href="#/explorer" data-view="explorer">Explorer</a>
    <a href="#/pointers" data-view="pointers">Pointers</a>
    <a href="#/pins" data-view="pins">Pins</a>
    <a href="#/jobs" data-view="jobs">Jobs</a>
    <a href="#/events" data-view="events">Events</a>

    <div class="rail-foot">
      <dl class="rail-stats" id="rail-stats"></dl>
    </div>
  </nav>

  <main id="main" tabindex="-1">
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>

<aside class="drawer" id="drawer" hidden aria-label="Node detail">
  <div class="drawer-head">
    <h2 id="drawer-title">Node</h2>
    <button class="btn btn-ghost" id="drawer-close" type="button" aria-label="Close detail">✕</button>
  </div>
  <div id="drawer-body"></div>
</aside>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="/js/main.js" type="module"></script>
</body>
</html>
