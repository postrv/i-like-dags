[package]
name = "dag-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Content-addressed data model: CIDs, immutable DAG entries, content-defined file chunking, and Ed25519/DSSE signing."
categories = ["data-structures", "cryptography", "encoding"]
keywords = ["content-addressed", "dag", "cid", "merkle", "chunking"]

[features]
default = []
# Wires getrandom's wasm32 JS backend so the kernel (signing, anything
# that touches the RNG) compiles to wasm32-unknown-unknown. Native
# builds do not need it. Pair with the rustflags in `.cargo/config.toml`.
wasm = ["getrandom/wasm_js"]

[dependencies]
fastcdc = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
ciborium = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
getrandom = { workspace = true, optional = true }
